name: ChatOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependency
        run: pip install python-telegram-bot

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Test application import
        run: python -c "import app; print('Application imported successfully')"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chatops-project:latest .

      - name: Show Docker image
        run: docker images chatops-project